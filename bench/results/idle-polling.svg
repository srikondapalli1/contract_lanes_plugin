<rect width="760" height="470" fill="var(--surface)"/><text class="t" x="24" y="30">Waiting for cross-agent messages: tokens per hour</text><text class="st" x="24" y="48">/loop polling re-reads context C on every wake. The Lanes watcher is a script: it wakes the agent</text><text class="st" x="24" y="64">only on an actionable event, and costs 0 tokens while idle (not drawn: log scale).</text><text class="ph" x="70" y="96">Context C = 20K tokens</text><line class="grid" x1="70" x2="340" y1="372" y2="372"/><text class="ax" x="62" y="376" text-anchor="end">1,000</text><line class="grid" x1="70" x2="340" y1="307" y2="307"/><text class="ax" x="62" y="311" text-anchor="end">10K</text><line class="grid" x1="70" x2="340" y1="242" y2="242"/><text class="ax" x="62" y="246" text-anchor="end">100K</text><line class="grid" x1="70" x2="340" y1="177" y2="177"/><text class="ax" x="62" y="181" text-anchor="end">1M</text><line class="grid" x1="70" x2="340" y1="112" y2="112"/><text class="ax" x="62" y="116" text-anchor="end">10M</text><text class="ax" x="70" y="388" text-anchor="middle">1</text><text class="ax" x="115.70932805167098" y="388" text-anchor="middle">2</text><text class="ax" x="176.1337730015979" y="388" text-anchor="middle">5</text><text class="ax" x="221.8431010532689" y="388" text-anchor="middle">10</text><text class="ax" x="248.58134389665804" y="388" text-anchor="middle">15</text><text class="ax" x="267.55242910493985" y="388" text-anchor="middle">20</text><text class="ax" x="294.2906719483291" y="388" text-anchor="middle">30</text><text class="ax" x="340" y="388" text-anchor="middle">60</text><text class="ax" x="205" y="404" text-anchor="middle">polling interval N (minutes, log scale)</text><polyline fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="70,171.74193354305757 115.70932805167098,191.30888326121635 176.1337730015979,217.1749838248988 221.8431010532689,236.74193354305757 248.58134389665804,248.1878653816769 267.55242910493985,256.30888326121635 294.2906719483291,267.75481509983564 340,287.32176481799445"/><circle cx="70" cy="171.74193354305757" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>/loop every 1 min: 1.2M tokens/h</title></circle><circle cx="115.70932805167098" cy="191.30888326121635" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>/loop every 2 min: 602K tokens/h</title></circle><circle cx="176.1337730015979" cy="217.1749838248988" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>/loop every 5 min: 241K tokens/h</title></circle><circle cx="221.8431010532689" cy="236.74193354305757" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>/loop every 10 min: 120K tokens/h</title></circle><circle cx="248.58134389665804" cy="248.1878653816769" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>/loop every 15 min: 80K tokens/h</title></circle><circle cx="267.55242910493985" cy="256.30888326121635" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>/loop every 20 min: 60K tokens/h</title></circle><circle cx="294.2906719483291" cy="267.75481509983564" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>/loop every 30 min: 40K tokens/h</title></circle><circle cx="340" cy="287.32176481799445" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>/loop every 60 min: 20K tokens/h</title></circle><text class="v" x="78" y="165.74193354305757">1.2M/h</text><text class="v" x="338" y="305.32176481799445" text-anchor="end">20K/h</text><text class="l" x="125.70932805167098" y="183.30888326121635">/loop polling, every N min</text><line x1="70" x2="340" y1="248.19911485283893" y2="248.19911485283893" stroke="var(--s2)" stroke-width="2" stroke-linecap="round"><title>Lanes watch, 4 event/h: 80K tokens/h</title></line><text class="v" x="74" y="263.19911485283893">Lanes watch, 4 events/h: 80K</text><line x1="70" x2="340" y1="287.3330142891565" y2="287.3330142891565" stroke="var(--s3)" stroke-width="2" stroke-linecap="round"><title>Lanes watch, 1 event/h: 20K tokens/h</title></line><text class="v" x="74" y="281.3330142891565">Lanes watch, 1 event/h: 20K</text><line class="base" x1="70" x2="70" y1="112" y2="372"/><line class="base" x1="70" x2="340" y1="372" y2="372"/><text class="ph" x="440" y="96">Context C = 50K tokens</text><line class="grid" x1="440" x2="710" y1="372" y2="372"/><line class="grid" x1="440" x2="710" y1="307" y2="307"/><line class="grid" x1="440" x2="710" y1="242" y2="242"/><line class="grid" x1="440" x2="710" y1="177" y2="177"/><line class="grid" x1="440" x2="710" y1="112" y2="112"/><text class="ax" x="440" y="388" text-anchor="middle">1</text><text class="ax" x="485.709328051671" y="388" text-anchor="middle">2</text><text class="ax" x="546.1337730015979" y="388" text-anchor="middle">5</text><text class="ax" x="591.8431010532689" y="388" text-anchor="middle">10</text><text class="ax" x="618.581343896658" y="388" text-anchor="middle">15</text><text class="ax" x="637.5524291049398" y="388" text-anchor="middle">20</text><text class="ax" x="664.2906719483291" y="388" text-anchor="middle">30</text><text class="ax" x="710" y="388" text-anchor="middle">60</text><text class="ax" x="575" y="404" text-anchor="middle">polling interval N (minutes, log scale)</text><polyline fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="440,145.94255159847376 485.709328051671,165.50950131663254 546.1337730015979,191.37560188031497 591.8431010532689,210.94255159847376 618.581343896658,222.38848343709304 637.5524291049398,230.50950131663254 664.2906719483291,241.95543315525182 710,261.5223828734106"/><circle cx="440" cy="145.94255159847376" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>/loop every 1 min: 3M tokens/h</title></circle><circle cx="485.709328051671" cy="165.50950131663254" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>/loop every 2 min: 1.5M tokens/h</title></circle><circle cx="546.1337730015979" cy="191.37560188031497" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>/loop every 5 min: 601K tokens/h</title></circle><circle cx="591.8431010532689" cy="210.94255159847376" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>/loop every 10 min: 300K tokens/h</title></circle><circle cx="618.581343896658" cy="222.38848343709304" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>/loop every 15 min: 200K tokens/h</title></circle><circle cx="637.5524291049398" cy="230.50950131663254" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>/loop every 20 min: 150K tokens/h</title></circle><circle cx="664.2906719483291" cy="241.95543315525182" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>/loop every 30 min: 100K tokens/h</title></circle><circle cx="710" cy="261.5223828734106" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>/loop every 60 min: 50K tokens/h</title></circle><text class="v" x="448" y="139.94255159847376">3M/h</text><text class="v" x="708" y="279.5223828734106" text-anchor="end">50K/h</text><text class="l" x="495.709328051671" y="157.50950131663254">/loop polling, every N min</text><line x1="440" x2="710" y1="222.39299333486778" y2="222.39299333486778" stroke="var(--s2)" stroke-width="2" stroke-linecap="round"><title>Lanes watch, 4 event/h: 200K tokens/h</title></line><text class="v" x="444" y="237.39299333486778">Lanes watch, 4 events/h: 200K</text><line x1="440" x2="710" y1="261.5268927711853" y2="261.5268927711853" stroke="var(--s3)" stroke-width="2" stroke-linecap="round"><title>Lanes watch, 1 event/h: 50K tokens/h</title></line><text class="v" x="444" y="255.52689277118532">Lanes watch, 1 event/h: 50K</text><line class="base" x1="440" x2="440" y1="112" y2="372"/><line class="base" x1="440" x2="710" y1="372" y2="372"/><text class="ax" x="24" y="430">poll: (60/N)·(C + p), p = 79 tokens per poll turn · Lanes: E·(C + w), w = 71 tokens per wake · Lanes idle (E = 0): 0 tokens/h.</text><text class="ax" x="24" y="445">Prompt caching lowers the price of re-reading C, not the token count. Context sizes are parameters, not measurements.</text></svg>
