<svg xmlns="http://www.w3.org/2000/svg" width="760" height="377" viewBox="0 0 760 377" role="img" aria-labelledby="t d">
<title id="t">Seeded bugs caught (19 single-bug mutants of the example)</title><desc id="d">Each approach runs on each mutant; lanes check runs 10 seeds (1..10). Blue = Lanes, gray = alternatives.</desc><style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --gray:#a3a199; }
  @media (prefers-color-scheme: dark) { svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --gray:#6b6a64; } }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
  .t { font-size:16px; font-weight:600 } .st { font-size:12.5px; fill:var(--ink2) } .l { font-size:12px; fill:var(--ink2) }
  .v { font-size:12px; fill:var(--ink); font-variant-numeric: tabular-nums } .ax { font-size:11px; fill:var(--muted); font-variant-numeric: tabular-nums }
  .grid { stroke:var(--grid); stroke-width:1 } .base { stroke:var(--axis); stroke-width:1 } .ph { font-size:13px; font-weight:600; fill:var(--ink) }
</style>
<rect width="760" height="377" fill="var(--surface)"/><text class="t" x="24" y="30">Seeded bugs caught (19 single-bug mutants of the example)</text><text class="st" x="24" y="48">Each approach runs on each mutant; lanes check runs 10 seeds (1..10). Blue = Lanes, gray = alternatives.</text><text class="ph" x="24" y="84">Mutants caught</text><text class="ax" x="690" y="84" text-anchor="end">mutants</text><line class="grid" x1="254" x2="254" y1="98" y2="308"/><text class="ax" x="254" y="321" text-anchor="middle">0</text><line class="grid" x1="368.7368421052631" x2="368.7368421052631" y1="98" y2="308"/><text class="ax" x="368.7368421052631" y="321" text-anchor="middle">5</text><line class="grid" x1="483.4736842105263" x2="483.4736842105263" y1="98" y2="308"/><text class="ax" x="483.4736842105263" y="321" text-anchor="middle">10</text><line class="grid" x1="598.2105263157895" x2="598.2105263157895" y1="98" y2="308"/><text class="ax" x="598.2105263157895" y="321" text-anchor="middle">15</text><line class="grid" x1="690" x2="690" y1="98" y2="308"/><text class="ax" x="690" y="321" text-anchor="middle">19</text><text class="l" x="244" y="117" text-anchor="end">lanes check (caught on every seed)</text><path d="M254,104 h432 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-432 z" fill="var(--s1)"><title>lanes check (caught on every seed): 19 mutants</title></path><text class="v" x="696" y="117">19/19 (100%)</text><text class="l" x="244" y="147" text-anchor="end">lanes check (caught on ≥1 seed)</text><path d="M254,134 h432 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-432 z" fill="var(--s1)"><title>lanes check (caught on ≥1 seed): 19 mutants</title></path><text class="v" x="696" y="147">19/19 (100%)</text><text class="l" x="244" y="177" text-anchor="end">lanes check --fast (every seed)</text><path d="M254,164 h386.10526315789474 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-386.10526315789474 z" fill="var(--s1)"><title>lanes check --fast (every seed): 17 mutants</title></path><text class="v" x="650.1052631578948" y="177">17/19 (89%)</text><text class="l" x="244" y="207" text-anchor="end">Pact consumer + provider</text><path d="M254,194 h133.68421052631578 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-133.68421052631578 z" fill="var(--gray)"><title>Pact consumer + provider: 6 mutants</title></path><text class="v" x="397.6842105263158" y="207">6/19 (32%)</text><text class="l" x="244" y="237" text-anchor="end">hand-written zod + vitest</text><path d="M254,224 h179.57894736842104 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-179.57894736842104 z" fill="var(--gray)"><title>hand-written zod + vitest: 8 mutants</title></path><text class="v" x="443.57894736842104" y="237">8/19 (42%)</text><text class="l" x="244" y="267" text-anchor="end">TypeScript strict (types only)</text><path d="M254,254 h64.84210526315789 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-64.84210526315789 z" fill="var(--gray)"><title>TypeScript strict (types only): 3 mutants</title></path><text class="v" x="328.8421052631579" y="267">3/19 (16%)</text><text class="l" x="244" y="297" text-anchor="end">Pact ∪ zod+vitest ∪ tsc</text><path d="M254,284 h179.57894736842104 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-179.57894736842104 z" fill="var(--gray)"><title>Pact ∪ zod+vitest ∪ tsc: 8 mutants</title></path><text class="v" x="443.57894736842104" y="297">8/19 (42%)</text><line class="base" x1="254" x2="254" y1="98" y2="308"/><text class="ax" x="24" y="350">lanes check per-seed catches: min 19, max 19 of 19. Baseline (bug fixed) green for every approach: true.</text></svg>
