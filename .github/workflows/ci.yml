name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}", cache: pnpm }
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: pnpm install --frozen-lockfile
      - name: bundle is up to date (plugin/bin is committed; plugins install from git)
        run: pnpm bundle && git diff --exit-code -- plugin/bin
      - run: pnpm typecheck
      - run: pnpm test
      - name: budgets (SPEC §18)
        run: node scripts/lines.mjs
      - name: lanes checks itself
        run: node plugin/bin/lanes.mjs check --ci
